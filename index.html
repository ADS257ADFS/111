<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor 云端 Agent 教程</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f4f8;
      --muted: #9aa3b2;
      --accent: #7c5cff;
      --line: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1b2030, var(--bg) 55%);
      color: var(--text);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .steps {
      display: grid;
      gap: 12px;
      margin: 28px 0 0;
    }
    .step {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .step strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Cursor 云端 Agent 教程</h1>
      <p>这是独立教程仓库的示例首页，用来验证云端子代理可以在功能分支上修改代码。</p>
      <div class="steps">
        <div class="step"><strong>1.</strong> 绑定 GitHub 私有仓库</div>
        <div class="step"><strong>2.</strong> 用云端子代理做只读审查</div>
        <div class="step"><strong>3.</strong> 在独立分支上开发这个简单页面</div>
      </div>
    </section>
  </main>
</body>
</html>
