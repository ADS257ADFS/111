<body>
    <div id="shell" class="shell" tabindex="-1">
        <canvas id="emptyCanvasDotGrid" class="empty-canvas-dot-grid" aria-hidden="true"></canvas>
        <div id="world" class="world"></div>
        <div id="canvasEmptyHint" class="canvas-empty-hint empty-canvas-split-message" aria-label="双击开启无限创作模式">
            <p data-empty-split-text="双击开启无限创作模式">双击开启无限创作模式</p>
        </div>
        <div id="composer" class="composer">
                <div class="composer-card">
                    <span class="composer-card-material" aria-hidden="true"></span>
                    <span class="composer-card-surface" aria-hidden="true"></span>
                    <div class="composer-card-topbar" aria-label="资产库与共创">
                        <div class="composer-card-topbar-left">
                            <div id="inputThumbsRow" class="input-thumbs-row"></div>
                        </div>
                        <div class="composer-card-topbar-right">
                            <div class="composer-asset-shortcuts" aria-label="输入区功能快捷入口">
                                <button class="composer-asset-shortcut" type="button" data-composer-asset-library aria-label="资产库" title="打开资产库"><i data-lucide="circle-plus"></i><span>资产库</span></button>
                            </div>
                            <div id="composerCoCreateSlot" class="composer-co-create-slot"></div>
                        </div>
                    </div>
                    <div class="prompt-row">
                        <div id="promptInput" class="prompt-input" contenteditable="true" data-i18n-placeholder="smart.promptPlaceholder" data-placeholder="描述你想生成或编辑的图片..."></div>
                        <button id="composerHeightToggle" class="composer-height-toggle" type="button" aria-label="展开输入框" aria-pressed="false" title="展开输入框">
                            <i class="composer-height-icon-expand" data-lucide="maximize-2"></i>
                            <i class="composer-height-icon-collapse" data-lucide="minimize-2"></i>
                        </button>
                        <div id="mentionPicker" class="mention-picker"></div>
                    </div>
                    <div id="inputPromptPreview" class="input-prompt-preview"></div>
                    <div class="composer-footer">
                        <div class="composer-footer-bar">
                            <div class="composer-footer-tools">
                                <div id="composerKindWrap" class="composer-tool-wrap composer-kind-wrap">
                                    <button id="composerKindBtn" class="composer-tool-btn" type="button" title="模式切换" aria-label="模式切换" aria-haspopup="true" aria-expanded="false">
                                        <i data-lucide="image"></i><span id="composerKindBtnLabel">图片生成</span><i data-lucide="chevron-up" class="composer-tool-caret"></i>
                                    </button>
                                    <div id="composerKindPopover" class="composer-tool-popover" role="menu" aria-label="模式切换">
                                        <div id="apiKindToggle" class="composer-kind-toggle" role="group" aria-label="模式切换">
                                            <button type="button" data-kind="image" class="active" title="图片生成" aria-label="图片生成" role="menuitem"><i data-lucide="image"></i><span>图片生成</span></button>
                                            <button type="button" data-kind="video" title="视频生成" aria-label="视频生成" role="menuitem"><i data-lucide="film"></i><span>视频生成</span></button>
                                            <button type="button" data-kind="text" title="文本生成" aria-label="文本生成" role="menuitem"><i data-lucide="message-square-text"></i><span>文本生成</span></button>
                                            <button type="button" data-kind="audio" title="音频生成" aria-label="音频生成" role="menuitem"><i data-lucide="music-2"></i><span>音频生成</span></button>
                                        </div>
                                    </div>
                                </div>
                                <div id="composerApiSettingsWrap" class="composer-tool-wrap">
                                    <button id="composerApiSettingsBtn" class="composer-tool-btn" type="button" title="API设置" aria-label="API设置">
                                        <span id="composerApiSettingsBtnIcon" class="composer-model-brand-icon" aria-hidden="true"><i data-lucide="settings-2"></i></span><span id="composerApiSettingsBtnLabel">API设置</span><i data-lucide="chevron-up" class="composer-tool-caret"></i>
                                    </button>
                                    <div id="composerApiSettingsPopover" class="composer-tool-popover">
                                        <div id="composerHeadParams" class="composer-head-params"></div>
                                        <div id="dynamicParams" class="dynamic-params composer-overflow-params"></div>
                                    </div>
                                </div>
                                <div id="composerVideoReferenceWrap" class="composer-tool-wrap composer-video-reference-wrap" hidden>
                                    <button id="composerVideoReferenceBtn" class="composer-tool-btn" type="button" title="参考模式" aria-label="参考模式" aria-expanded="false">
                                        <i data-lucide="image-plus"></i><span id="composerVideoReferenceBtnLabel">参考</span><i data-lucide="chevron-up" class="composer-tool-caret"></i>
                                    </button>
                                    <div id="composerVideoReferencePopover" class="composer-tool-popover composer-video-reference-popover">
                                        <div id="composerVideoReferencePanel" class="composer-video-reference-panel"></div>
                                    </div>
                                </div>
                                <div id="composerSizeWrap" class="composer-tool-wrap">
                                    <button id="composerSizeBtn" class="composer-tool-btn" type="button" title="尺寸" aria-label="尺寸">
                                        <i data-lucide="scan-line"></i><span class="composer-size-summary"><span id="composerSizeBtnLabel">尺寸</span><span id="composerVideoAudioSummary" class="composer-video-audio-summary" hidden><i data-lucide="volume-2"></i></span><span class="composer-size-summary-divider"></span><span id="composerCountBtnLabel">1张</span></span><i data-lucide="chevron-up" class="composer-tool-caret"></i>
                                    </button>
                                    <div id="composerSizePopover" class="composer-tool-popover">
                                        <div id="composerImageSizeMenu" class="composer-submenu-stack">
                                            <div class="composer-submenu-section" data-composer-size-section="ratio">
                                                <div class="composer-submenu-label">尺寸选择</div>
                                                <div id="composerSizePanel" class="composer-size-panel"></div>
                                            </div>
                                            <div class="composer-submenu-section" data-composer-size-section="quality">
                                                <div class="composer-submenu-label">质量选择</div>
                                                <div id="composerQualityPanel" class="composer-quality-panel"></div>
                                            </div>
                                            <div class="composer-submenu-section" data-composer-size-section="count">
                                                <div class="composer-submenu-label">张数选择</div>
                                                <div id="composerCountPanel" class="composer-count-panel"></div>
                                            </div>
                                        </div>
                                        <div id="composerVideoSizeMenu" class="composer-submenu-stack" hidden></div>
                                    </div>
                                </div>
                            </div>
                            <div class="composer-actions">
                                <div class="composer-run-capsule" role="group" aria-label="预计消耗 5 积分">
                                    <div class="composer-run-cost" title="预计消耗 5 积分" aria-hidden="true">
                                        <i data-lucide="zap"></i>
                                        <span id="composerModelCostValue">5</span>
                                    </div>
                                    <button id="runBtn" class="run-btn" type="button"><i data-lucide="arrow-up"></i><span data-i18n="smart.run">运行</span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <button class="smart-back" type="button" onclick="backToCanvasList()"><i data-lucide="arrow-left"></i><span data-i18n="canvas.backToList">返回画布列表</span></button>
        <div id="smartTitle" class="smart-title" data-i18n="smart.title">智能画布</div>
        <input id="fileInput" type="file" accept="image/*,video/*,audio/*,.psd,application/vnd.adobe.photoshop,image/vnd.adobe.photoshop" multiple hidden>
        <div id="minimap" class="smart-minimap" aria-hidden="true">
            <div id="minimapContent" class="smart-minimap-content"></div>
        </div>
        <div id="canvasBottomChrome" class="canvas-bottom-chrome" aria-label="画布导航">
            <div class="canvas-bottom-capsule" role="toolbar" aria-label="画布工具">
                <button id="canvasArrangeAllBtn" class="canvas-bottom-capsule-btn" type="button" title="整理全局" aria-label="整理全局">
                    <i data-lucide="layout-dashboard"></i>
                </button>
                <span class="canvas-zoom-divider" aria-hidden="true"></span>
                <button id="canvasZoomOutBtn" class="canvas-bottom-capsule-btn canvas-zoom-step-btn" type="button" title="缩小 (Ctrl -)" aria-label="缩小">
                    <i data-lucide="minus"></i>
                </button>
                <div class="canvas-zoom-menu-wrap">
                    <button id="canvasZoomMenuBtn" class="canvas-zoom-value-btn" type="button" title="视角比例" aria-label="视角比例，当前 100%" aria-haspopup="menu" aria-expanded="false">
                        <span id="canvasZoomValue">100%</span>
                        <i data-lucide="chevron-down"></i>
                    </button>
                    <div id="canvasZoomMenu" class="canvas-zoom-menu ui-menu" role="menu" hidden>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitem" data-zoom-action="out"><span>缩小</span><kbd>Ctrl -</kbd></button>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitem" data-zoom-action="in"><span>放大</span><kbd>Ctrl +</kbd></button>
                        <div class="ui-menu-divider" role="separator"></div>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitem" data-zoom-action="fit"><span>适应视图</span><kbd>Shift 1</kbd></button>
                        <div class="ui-menu-divider" role="separator"></div>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitemradio" data-zoom-scale="0.5"><span>50%</span></button>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitemradio" data-zoom-scale="1"><span>100%</span></button>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitemradio" data-zoom-scale="2"><span>200%</span></button>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitemradio" data-zoom-scale="3"><span>300%</span></button>
                        <button class="ui-menu-item canvas-zoom-menu-item" type="button" role="menuitemradio" data-zoom-scale="4"><span>400%</span></button>
                    </div>
                </div>
                <button id="canvasZoomInBtn" class="canvas-bottom-capsule-btn canvas-zoom-step-btn" type="button" title="放大 (Ctrl +)" aria-label="放大">
                    <i data-lucide="plus"></i>
                </button>
                <button id="canvasDownloadCenterBtn" class="canvas-bottom-capsule-btn" type="button" title="下载记录" aria-label="下载记录" aria-expanded="false">
                    <i data-lucide="download"></i>
                    <span id="canvasDownloadCenterBadge" class="canvas-download-center-badge" hidden></span>
                </button>
                <button id="canvasMinimapToggle" class="canvas-bottom-capsule-btn" type="button" title="小地图" aria-label="小地图" aria-pressed="false">
                    <i data-lucide="map"></i>
                </button>
                <button id="canvasFitViewBtn" class="canvas-bottom-capsule-btn" type="button" title="视角重置" aria-label="视角重置">
                    <i data-lucide="scan"></i>
                </button>
            </div>
        </div>
        <aside id="canvasDownloadCenterPanel" class="canvas-download-center-panel" hidden aria-hidden="true" aria-label="下载记录">
            <header class="canvas-download-center-head">
                <div><i data-lucide="download"></i><strong>下载记录</strong><span id="canvasDownloadCenterCount">0</span></div>
                <button id="canvasDownloadCenterClose" type="button" title="关闭" aria-label="关闭下载记录"><i data-lucide="x"></i></button>
            </header>
            <div id="canvasDownloadCenterList" class="canvas-download-center-list" aria-live="polite"></div>
        </aside>
        <button id="newCanvasBtn" class="canvas-new-fab is-standalone-only" type="button" title="新建画布" aria-label="新建画布"><i data-lucide="plus"></i></button>
        <div id="imageQuickToolbar" class="image-quick-toolbar" hidden data-image-quick-toolbar></div>
        <div id="imageHdPopover" class="image-hd-popover" style="position:absolute; z-index:87; display:none; padding:10px 12px; min-width:180px;">
            <div style="margin-bottom:8px;">楂樻竻鍊嶇巼</div>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px;">
                <button type="button" class="image-hd-scale-btn" data-hd-scale="1" style="height:32px; cursor:pointer;">1x</button>
                <button type="button" class="image-hd-scale-btn" data-hd-scale="2" style="height:32px; cursor:pointer;">2x</button>
                <button type="button" class="image-hd-scale-btn" data-hd-scale="4" style="height:32px; cursor:pointer;">4x</button>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:6px;">
                <button id="imageHdCancel" type="button" style="height:28px; padding:0 10px; border-radius:8px; border:1px solid rgba(158,168,180,.22); background:transparent; font-size:11px; font-weight:600; cursor:pointer;">鍙栨秷</button>
                <button id="imageHdApply" type="button" style="height:28px; padding:0 10px; border-radius:8px; border:1px solid var(--ui-accent); background:var(--ui-accent); color:#fff; font-size:11px; font-weight:600; cursor:pointer;">搴旂敤</button>
            </div>
        </div>
        <div id="selectionBox" class="selection-box">
            <div id="selectionBoxCapsule" class="selection-box-capsule" hidden></div>
        </div>
        <div id="smartLogModal" class="log-modal" onclick="closeSmartCanvasLog()">
            <div class="log-panel" onclick="event.stopPropagation()">
                <div class="log-head">
                    <div class="log-title" data-i18n="canvas.generationLogs">鐢熸垚鏃ュ織</div>
                    <button class="preview-icon-btn" type="button" onclick="closeSmartCanvasLog()" title="关闭" data-i18n-title="common.close"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div id="smartLogList" class="log-list"></div>
            </div>
        </div>
        <div id="smartShortcutModal" class="shortcut-modal" onclick="closeSmartCanvasShortcuts()">
            <div class="shortcut-panel" onclick="event.stopPropagation()">
                <div class="shortcut-head">
                    <div class="shortcut-title"><i data-lucide="keyboard"></i><span data-i18n="smart.shortcuts">快捷键</span></div>
                    <button class="preview-icon-btn" type="button" onclick="closeSmartCanvasShortcuts()" title="关闭" data-i18n-title="common.close"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="shortcut-list">
                    <div class="shortcut-item"><span class="shortcut-keys"><kbd>Ctrl</kbd></span><span data-i18n="smart.shortcutBoxSelect">按住并拖拽框选节点</span></div>
                    <div class="shortcut-item"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>G</kbd></span><span data-i18n="smart.shortcutGroup">合并选中的图片为组</span></div>
                    <div class="shortcut-item"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>Z</kbd></span><span data-i18n="smart.shortcutUndo">撤销上一步操作</span></div>
                    <div class="shortcut-item"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>C</kbd></span><span data-i18n="smart.shortcutCopy">复制选中的节点</span></div>
                    <div class="shortcut-item"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>V</kbd></span><span data-i18n="smart.shortcutPaste">绮樿创鑺傜偣鎴栧壀璐存澘鍥剧墖</span></div>
