<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>GPT 对话</title>
    <script>
        (function(){
            try {
                var q = new URLSearchParams(location.search);
                if(q.get('dock') !== '1') return;
                document.documentElement.classList.add('gpt-dock-canvas-mode');
                var s = document.createElement('style');
                s.textContent = 'html.gpt-dock-canvas-mode #legacyInlineControls,html.gpt-dock-canvas-mode #providerSwitchWrap{display:none!important}'
                    + 'html.gpt-dock-canvas-mode #dockModelToolbar{display:none!important}';
                document.head.appendChild(s);
                document.addEventListener('DOMContentLoaded', function(){
                    document.body.classList.add('gpt-dock-canvas-mode');
                });
            } catch(e) {}
        })();
    </script>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                } else if(theme === 'aura') {
                    document.documentElement.classList.add('studio-theme-aura');
                    document.documentElement.classList.add('theme-aura');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/mutation-observer-guard.js?v=2026.06.08.85"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.06.08.85"></script>
    <script src="/static/js/theme.js?v=2026.06.08.85"></script>
    <script src="/static/js/i18n.js?v=2026.06.08.85"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.29.37">
    <link rel="stylesheet" href="/static/apps/gpt-dock/css/gpt-dock-chat.css?v=2026.08.27.cvscomp1">
<link rel="stylesheet" href="/static/apps/gpt-dock/css/gpt-dock-canvas-mode.css?v=2026.08.27.queueui2">
<link rel="stylesheet" href="/static/css/visual-system-preview.css?v=2026.08.26.dockhdr2">
    <link rel="stylesheet" href="/static/css/visual-typography-system.css?v=2026.08.24.87">
<link rel="stylesheet" href="/static/css/dark-desaturated/apps-gpt-dock-gpt-chat.css?v=2026.08.26.dockdark1">
<link rel="stylesheet" href="/static/css/dark-desaturated/panel-polish.css?v=2026.08.13.1">
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=2026.08.27.cvscomp1">
    <link rel="stylesheet" href="/static/css/ui-primitives.css?v=2026.08.24.1">
    <link rel="stylesheet" href="/static/css/minimax-visual.css?v=2026.08.27.dockline1">
</head>
<body>
    <div class="chat-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div class="title-block">
                    <h1 id="chatTitle" data-i18n="chat.newConversation">未命名对话</h1>
                    <p id="modelLabel">Ready</p>
                </div>
                <div class="top-actions">
                    <button onclick="newConversation()" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="chat.new">NEW</span></button>
                    <button onclick="toggleHistory(undefined, event)" class="action-btn" title="历史对话" data-i18n-title="chat.history"><i data-lucide="history" class="w-4 h-4"></i><span data-i18n="chat.history">HISTORY</span></button>
                    <div id="historyPopover" class="history-popover">
                        <div class="flex items-center justify-between px-2 pb-3">
                            <span class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400" data-i18n="chat.historyTitle">Conversations</span>
                            <button onclick="toggleHistory(false, event)" class="text-gray-400 hover:text-black"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div id="threadList" class="thread-list"></div>
                    </div>
                </div>
            </div>
        </header>

        <section id="messages" class="messages"></section>

        <div class="composer-wrap">
            <div class="composer">
                <div id="composerBody" class="composer-body">
                    <textarea id="messageInput" rows="4" placeholder="描述创意或需求，/使用技能，@引用参考或插件" data-i18n-placeholder="chat.inputPlaceholder" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                    <div id="refStrip" class="ref-strip"></div>
                    <div class="composer-inside-foot">
                        <div class="composer-foot-left">
                            <button class="attach-btn" type="button" onclick="document.getElementById('chatFileInput').click()" title="上传文件" aria-label="上传文件"><i data-lucide="paperclip" class="w-4 h-4"></i></button>
                            <div id="skillPicker" class="skill-picker">
                                <button id="skillBtn" class="attach-btn skill-btn" type="button" onclick="toggleSkillMenu(event)" title="技能包" aria-label="技能包" aria-haspopup="menu" aria-expanded="false">
                                    <i id="skillBtnIcon" data-lucide="sparkles" class="w-4 h-4"></i>
                                    <span class="skill-active-dot" aria-hidden="true"></span>
                                </button>
                                <div id="skillMenu" class="skill-menu composer-tool-popover hidden" role="menu" aria-label="技能包">
                                    <div class="skill-menu-head">
                                        <span>技能包</span>
                                        <button type="button" onclick="closeSkillMenu()" title="关闭" aria-label="关闭技能包"><i data-lucide="x" class="w-4 h-4"></i></button>
                                    </div>
                                    <div id="skillMenuList" class="skill-menu-list"><div class="skill-menu-state">正在读取…</div></div>
                                </div>
                            </div>
                            <div class="left-tools">
                                <div id="legacyInlineControls" class="inline-controls">
                                    <div class="mode-switch">
                                        <button id="chatModeBtn" class="active" onclick="setMode('chat')"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i><span data-i18n="chat.chatMode">Chat</span></button>
                                        <button id="imageModeBtn" onclick="setMode('image')"><i data-lucide="image-plus" class="w-3.5 h-3.5"></i><span data-i18n="chat.imageMode">Image</span></button>
                                    </div>
                                    <div id="providerSwitchWrap" class="provider-switch">
                                        <select id="providerSelect" class="provider-select" onchange="setProvider(this.value)"></select>
                                        <select id="modelSelect" class="provider-select" onchange="setActiveModel(this.value)"></select>
                                    </div>
                                    <div id="imageControls" class="image-controls hidden">
                                        <div class="mini-ratio">
                                            <button id="chat-ratio-square" class="active" onclick="setChatRatio('square')"><i data-lucide="square" class="w-3 h-3"></i>1:1</button>
                                            <button id="chat-ratio-portrait" onclick="setChatRatio('portrait')"><i data-lucide="rectangle-vertical" class="w-3 h-3"></i>2:3</button>
                                            <button id="chat-ratio-landscape" onclick="setChatRatio('landscape')"><i data-lucide="rectangle-horizontal" class="w-3 h-3"></i>3:2</button>
                                            <button id="chat-ratio-portrait43" onclick="setChatRatio('portrait43')"><i data-lucide="rectangle-vertical" class="w-3 h-3"></i>3:4</button>
                                            <button id="chat-ratio-landscape43" onclick="setChatRatio('landscape43')"><i data-lucide="rectangle-horizontal" class="w-3 h-3"></i>4:3</button>
                                            <button id="chat-ratio-story" onclick="setChatRatio('story')"><i data-lucide="smartphone" class="w-3 h-3"></i>9:16</button>
                                            <button id="chat-ratio-wide" onclick="setChatRatio('wide')"><i data-lucide="monitor" class="w-3 h-3"></i>16:9</button>
                                        </div>
                                        <div class="resolution-toggle" title="分辨率" data-i18n-title="chat.resolution">
                                            <button id="chat-res-1k" class="resolution-option active" onclick="setChatResolution('1k')">1K</button>
                                            <button id="chat-res-2k" class="resolution-option" onclick="setChatResolution('2k')">2K</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="composer-foot-right">
                            <div id="dockModelToolbar" class="dock-api-toolbar hidden">
                                <div class="dock-api-wrap">
                                    <button type="button" class="dock-api-btn" id="dockApiBtn" title="模型设置" onclick="toggleDockApiPanel(event)" aria-haspopup="dialog" aria-expanded="false">
                                        <i data-lucide="zap" class="dock-api-icon"></i>
                                        <span id="dockApiBtnLabel">Ready</span>
                                        <i data-lucide="chevron-up" class="dock-api-chevron"></i>
                                    </button>
                                    <div id="dockApiPanel" class="dock-api-panel hidden"></div>
                                </div>
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn" title="发送" data-i18n-title="chat.send" aria-label="发送"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
                        </div>
                        <input id="chatFileInput" type="file" multiple hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.ppt,.pptx,.txt,.md,.csv,.json,.xml,.html,.htm,.xls,.xlsx,.ai" onchange="uploadFiles(this.files);this.value=''">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="image-lightbox" hidden>
        <div class="image-lightbox-backdrop" onclick="closeImagePreview()"></div>
        <div class="image-lightbox-frame">
            <button type="button" class="image-lightbox-close" onclick="closeImagePreview()" title="关闭 (Esc)"><i data-lucide="x" class="w-5 h-5"></i></button>
            <img id="imageLightboxImg" alt="预览图片">
        </div>
    </div>

    <script src="/static/apps/gpt-dock/js/gpt-dock-chat-core.js?v=2026.06.08.85"></script>
    <script src="/static/apps/gpt-dock/js/gpt-dock-canvas-agent.js?v=2026.06.08.85"></script>
    <script src="/static/apps/gpt-dock/js/gpt-dock-chat-app.js?v=2026.08.15.1"></script>
</body>
</html>
