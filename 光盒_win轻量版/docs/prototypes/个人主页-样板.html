<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光盒 · 个人主页面板样板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: "Segoe UI", "Microsoft YaHei UI", "MiSans Variable", sans-serif;
      font-size: 16px; color: #292929;
      background: #ececee;
      background-image:
        radial-gradient(ellipse 300px 240px at 20% 30%, rgba(255,120,160,.3), transparent 70%),
        radial-gradient(ellipse 280px 220px at 80% 70%, rgba(80,170,255,.35), transparent 70%);
    }
    .toolbar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    a.btn {
      display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
      border: 1px solid rgba(0,0,0,.10); border-radius: 8px; background: rgba(255,255,255,.55);
      backdrop-filter: blur(22px); color: #292929; text-decoration: none; font-size: 14px;
    }
    .dialog {
      width: min(700px, 100%); display: grid; grid-template-columns: 190px 1fr;
      border: 1px solid rgba(0,0,0,.10); border-radius: 14px;
      background: rgba(255,255,255,.50); backdrop-filter: blur(22px) saturate(150%);
      box-shadow: 0 4px 24px rgba(0,0,0,.10); overflow: hidden;
    }
    .nav { padding: 14px; border-right: 1px solid rgba(0,0,0,.07); background: rgba(0,0,0,.02); }
    .nav button {
      display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; padding: 0 12px;
      border: none; border-radius: 6px; background: transparent; font-size: 16px; text-align: left; cursor: pointer;
    }
    .nav button.is-active { background: rgba(10,132,255,.12); color: #0a84ff; }
    .body { padding: 24px 28px; }
    .body h1 { font-size: 18px; margin-bottom: 6px; }
    .body > p { font-size: 14px; color: #717171; margin-bottom: 20px; }
    .card {
      display: flex; align-items: center; gap: 16px; padding: 18px; margin-bottom: 14px;
      border: 1px solid rgba(0,0,0,.10); border-radius: 10px;
    }
    .avatar {
      width: 52px; height: 52px; border-radius: 50%; background: #efefef;
      border: 1px solid rgba(0,0,0,.10); display: grid; place-items: center; font-size: 22px;
    }
    .balance {
      padding: 18px; border: 1px solid rgba(0,0,0,.10); border-radius: 10px;
      background: rgba(10,132,255,.06);
    }
    .balance strong { font-size: 32px; color: #0a84ff; }
    .hint {
      margin-top: 16px; font-size: 13px; color: #717171;
      padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,.04);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn" href="spectrum-full-shell.html">← 返回完整样板</a>
  </div>
  <div class="dialog">
    <nav class="nav">
      <button class="is-active">👤 用户中心</button>
      <button>📊 用量看板</button>
      <button>🕐 历史记录</button>
      <button>⚙ 设置</button>
      <button>❓ 帮助中心</button>
    </nav>
    <div class="body">
      <h1>用户中心</h1>
      <p>点击左下角「用户」→「个人主页」后打开的页面（单独样板，不挡画布）。</p>
      <div class="card">
        <div class="avatar">👤</div>
        <div>
          <strong style="font-size:16px">用户</strong><br>
          <span style="font-size:14px;color:#717171">光盒个人账户</span>
        </div>
      </div>
      <div class="balance">
        <div style="font-size:14px;color:#717171;margin-bottom:4px">可用积分</div>
        <strong>2365</strong> <span style="font-size:14px">积分</span>
      </div>
      <div class="hint">此面板本身也使用磨砂半透明材质，背后彩色背景可透视。</div>
    </div>
  </div>
</body>
</html>
