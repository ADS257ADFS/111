<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视觉样板 A · 创作工作区壳层</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--lb-font);
      font-size: var(--lb-type-body);
      color: var(--lb-text);
      background: var(--lb-bg-canvas);
    }

    .proto-badge {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 4px 12px;
      border-radius: var(--lb-radius-pill);
      background: var(--lb-accent);
      color: #fff;
      font-size: var(--lb-type-meta);
      font-weight: var(--lb-weight-medium);
      pointer-events: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: var(--lb-sidebar-w) 1fr var(--lb-panel-w);
      grid-template-rows: var(--lb-titlebar-h) 1fr;
      height: 100vh;
    }

    /* 顶栏 */
    .titlebar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--lb-titlebar-h);
      padding: 0 var(--lb-space-3);
      background: var(--lb-bg-shell);
      border-bottom: 1px solid var(--lb-divider);
    }
    .titlebar-drag { flex: 1; height: 100%; -webkit-app-region: drag; }
    .titlebar-tools {
      display: flex;
      align-items: center;
      gap: var(--lb-space-2);
    }
    .titlebar-search {
      width: 200px;
      height: var(--lb-control-sm);
      padding: 0 var(--lb-space-3);
      border: 1px solid var(--lb-border);
      border-radius: var(--lb-radius-control);
      background: var(--lb-bg-input);
      color: var(--lb-text);
      font-size: var(--lb-type-compact);
    }
    .titlebar-search::placeholder { color: var(--lb-text-muted); }
    .titlebar-search:focus { outline: none; border-color: var(--lb-accent); box-shadow: 0 0 0 2px var(--lb-focus-ring); }
    .window-btn {
      width: 28px; height: 22px;
      border: none; border-radius: 4px;
      background: transparent; color: var(--lb-text-secondary);
      cursor: pointer;
    }
    .window-btn:hover { background: var(--lb-hover); }

    /* 左侧栏 */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--lb-bg-shell);
      border-right: 1px solid var(--lb-divider);
      padding: var(--lb-space-3);
      overflow: hidden;
    }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--lb-space-1) var(--lb-space-2) var(--lb-space-4);
    }
    .sidebar-logo {
      font-size: var(--lb-type-compact);
      font-weight: var(--lb-weight-title);
      color: var(--lb-text-secondary);
      letter-spacing: 0.02em;
    }
    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--lb-space-3);
      height: var(--lb-control-md);
      padding: 0 var(--lb-space-3);
      border: none;
      border-radius: var(--lb-radius-chrome);
      background: transparent;
      color: var(--lb-text);
      font-family: var(--lb-font);
      font-size: var(--lb-type-body);
      font-weight: var(--lb-weight-medium);
      text-align: left;
      cursor: pointer;
      transition: background-color var(--lb-motion-fast);
    }
    .nav-item:hover { background: var(--lb-hover); }
    .nav-item.is-active { background: var(--lb-selected); color: var(--lb-accent); }
    .nav-item svg { width: var(--lb-icon-sm); height: var(--lb-icon-sm); stroke-width: var(--lb-icon-stroke); flex-shrink: 0; }

    .recent-section { flex: 1; min-height: 0; margin-top: var(--lb-space-4); display: flex; flex-direction: column; }
    .recent-label {
      padding: var(--lb-space-2) var(--lb-space-3);
      font-size: var(--lb-type-meta);
      color: var(--lb-text-muted);
    }
    .recent-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
    .recent-row {
      display: flex;
      align-items: center;
      gap: var(--lb-space-2);
      height: var(--lb-control-md);
      padding: 0 var(--lb-space-2);
      border-radius: var(--lb-radius-chrome);
      cursor: pointer;
      transition: background-color var(--lb-motion-fast);
    }
    .recent-row:hover { background: var(--lb-hover); }
    .recent-row.is-active { background: var(--lb-selected); }
    .recent-thumb {
      width: 22px; height: 22px;
      border-radius: var(--lb-radius-chrome);
      background: var(--lb-bg-elevated);
      border: 1px solid var(--lb-divider);
      display: flex; align-items: center; justify-content: center;
      color: var(--lb-text-muted);
    }
    .recent-thumb svg { width: 12px; height: 12px; }
    .recent-name { flex: 1; font-size: var(--lb-type-compact); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-meta { font-size: var(--lb-type-meta); color: var(--lb-text-muted); }

    .sidebar-footer {
      display: flex;
      align-items: center;
      gap: var(--lb-space-2);
      padding-top: var(--lb-space-3);
      border-top: 1px solid var(--lb-divider);
    }
    .user-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: var(--lb-space-2);
      height: 32px;
      padding: 0 var(--lb-space-2);
      border: none;
      border-radius: var(--lb-radius-chrome);
      background: transparent;
      color: var(--lb-text);
      font-size: var(--lb-type-compact);
      cursor: pointer;
    }
    .user-btn:hover { background: var(--lb-hover); }
    .user-avatar {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lb-accent), #6eb6ff);
    }

    /* 画布区 — 干净克制，无圆角卡片 */
    .canvas-area {
      position: relative;
      background: var(--lb-bg-canvas);
      overflow: hidden;
    }
    .canvas-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, var(--lb-border) 0.6px, transparent 0.6px);
      background-size: 18px 18px;
      opacity: 0.55;
    }
    .canvas-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lb-text-muted);
      font-size: var(--lb-type-body);
      pointer-events: none;
    }

    /* 右上导航胶囊 */
    .canvas-nav {
      position: absolute;
      top: var(--lb-space-3);
      right: var(--lb-space-3);
      display: flex;
      align-items: center;
      gap: var(--lb-space-2);
    }
    .nav-capsule {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--lb-border);
      border-radius: var(--lb-radius-card);
      background: var(--lb-bg-elevated);
      box-shadow: var(--lb-shadow-float);
    }
    .nav-capsule .lb-btn.is-icon.is-sm { border-radius: var(--lb-radius-chrome); }
    .nav-capsule .zoom-label {
      width: 36px;
      text-align: center;
      font-size: var(--lb-type-meta);
      color: var(--lb-text-muted);
    }
    .nav-capsule .v-divider { width: 1px; height: 16px; background: var(--lb-divider); margin: 0 2px; }

    /* 底部输入栏 */
    .composer-wrap {
      position: absolute;
      left: 50%;
      bottom: var(--lb-space-5);
      transform: translateX(-50%);
      width: min(var(--lb-composer-w), calc(100% - 48px));
    }
    .composer {
      border: 1px solid var(--lb-border);
      border-radius: var(--lb-radius-card);
      background: var(--lb-bg-composer);
      box-shadow: var(--lb-shadow-float);
      overflow: hidden;
    }
    .composer-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 var(--lb-space-3);
      background: var(--lb-bg-composer-top);
      border-bottom: 1px solid var(--lb-divider);
    }
    .composer-modes { display: flex; gap: var(--lb-space-1); }
    .composer-body {
      padding: var(--lb-space-4) var(--lb-space-4) var(--lb-space-3);
      min-height: 88px;
    }
    .composer-prompt {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--lb-text);
      font-family: var(--lb-font);
      font-size: var(--lb-type-body);
      line-height: var(--lb-leading-body);
      resize: none;
      outline: none;
    }
    .composer-prompt::placeholder { color: var(--lb-text-muted); }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--lb-space-3) var(--lb-space-3);
    }
    .composer-params { display: flex; gap: var(--lb-space-1); flex-wrap: wrap; }
    .composer-run { display: flex; align-items: center; gap: var(--lb-space-3); }
    .composer-cost { font-size: var(--lb-type-meta); color: var(--lb-text-muted); }

    /* 右侧属性/对话面板 */
    .right-panel {
      display: flex;
      flex-direction: column;
      background: var(--lb-bg-chrome);
      border-left: 1px solid var(--lb-divider);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 var(--lb-space-4);
      border-bottom: 1px solid var(--lb-divider);
    }
    .panel-title { font-size: var(--lb-type-body); font-weight: var(--lb-weight-medium); }
    .panel-body { flex: 1; overflow: auto; padding: var(--lb-space-4); display: flex; flex-direction: column; gap: var(--lb-space-3); }
    .chat-bubble-user {
      align-self: flex-end;
      max-width: 85%;
      padding: var(--lb-space-2) var(--lb-space-3);
      border-radius: var(--lb-radius-card) var(--lb-radius-card) 4px var(--lb-radius-card);
      background: var(--lb-hover);
      font-size: var(--lb-type-body);
      line-height: var(--lb-leading-body);
    }
    .chat-bubble-ai {
      align-self: flex-start;
      max-width: 90%;
      font-size: var(--lb-type-body);
      line-height: var(--lb-leading-body);
      color: var(--lb-text);
    }
    .panel-input-wrap {
      padding: var(--lb-space-3);
      border-top: 1px solid var(--lb-divider);
    }
    .panel-input-box {
      border: 1px solid var(--lb-border);
      border-radius: var(--lb-radius-card);
      background: var(--lb-bg-input);
      padding: var(--lb-space-3);
      min-height: 72px;
    }
    .panel-input-box textarea {
      width: 100%; border: none; background: transparent;
      font-family: var(--lb-font); font-size: var(--lb-type-body);
      color: var(--lb-text); resize: none; outline: none; min-height: 40px;
    }
    .panel-input-box textarea::placeholder { color: var(--lb-text-muted); }

    .proto-toolbar {
      position: fixed;
      bottom: var(--lb-space-3);
      right: calc(var(--lb-panel-w) + var(--lb-space-3));
      display: flex;
      gap: var(--lb-space-2);
      z-index: 100;
    }
  </style>
<style>
/* === 内嵌 Token === */
/**
 * 光盒 · Spectrum 2 桌面创作版 · 视觉样板 Token
 * 参考：Adobe Spectrum 2（medium 桌面尺度）+ Express 友好圆角浮层
 * 亮/暗仅颜色不同，结构尺寸完全相同
 */

:root {
  /* —— 品牌强调色（保留光盒蓝，结构对齐 Spectrum accent） —— */
  --lb-accent: #0a84ff;
  --lb-accent-hover: #339dff;
  --lb-accent-subtle: rgba(10, 132, 255, 0.12);
  --lb-accent-rgb: 10, 132, 255;

  /* —— 亮色 · Spectrum 灰阶语义 —— */
  --lb-bg-canvas: #f5f5f5;
  --lb-bg-chrome: #f8f8f8;
  --lb-bg-shell: #fafafa;
  --lb-bg-elevated: #ffffff;
  --lb-bg-input: #ffffff;
  --lb-bg-composer: #ffffff;
  --lb-bg-composer-top: rgba(245, 245, 247, 0.72);

  --lb-text: #292929;
  --lb-text-secondary: #505050;
  --lb-text-muted: #717171;
  --lb-text-disabled: #c6c6c6;
  --lb-text-on-accent: #ffffff;

  --lb-border: #dadada;
  --lb-border-strong: #c6c6c6;
  --lb-divider: #e8e8e8;

  --lb-hover: #efefef;
  --lb-pressed: #e3e3e3;
  --lb-selected: rgba(10, 132, 255, 0.12);
  --lb-focus-ring: rgba(10, 132, 255, 0.35);
  --lb-danger: #e34850;
  --lb-danger-subtle: rgba(227, 72, 80, 0.1);
  --lb-success: #2d9d78;
  --lb-backdrop: rgba(0, 0, 0, 0.42);

  --lb-shadow-float: 0 2px 8px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
  --lb-shadow-dialog: 0 4px 16px rgba(0, 0, 0, 0.08), 0 16px 48px rgba(0, 0, 0, 0.1);

  /* —— 字号（桌面创作工具密度，比手机 App 更紧凑） —— */
  --lb-font: "MiSans Variable", "MiSans", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --lb-type-title: 14px;
  --lb-type-body: 13px;
  --lb-type-compact: 12px;
  --lb-type-meta: 11px;
  --lb-weight-body: 400;
  --lb-weight-medium: 500;
  --lb-weight-title: 600;
  --lb-leading-tight: 1.25;
  --lb-leading-body: 1.45;

  /* —— 圆角：结构区克制，浮层更圆润（Express 方向） —— */
  --lb-radius-chrome: 6px;
  --lb-radius-control: 8px;
  --lb-radius-card: 10px;
  --lb-radius-float: 12px;
  --lb-radius-dialog: 14px;
  --lb-radius-pill: 999px;

  /* —— 控件高度（Spectrum desktop medium 略收紧） —— */
  --lb-control-sm: 24px;
  --lb-control-md: 30px;
  --lb-control-lg: 32px;
  --lb-menu-item-h: 32px;

  /* —— 间距（4px 网格） —— */
  --lb-space-1: 4px;
  --lb-space-2: 6px;
  --lb-space-3: 8px;
  --lb-space-4: 12px;
  --lb-space-5: 16px;
  --lb-space-6: 20px;
  --lb-space-7: 24px;
  --lb-space-8: 32px;

  /* —— 布局尺寸 —— */
  --lb-titlebar-h: 28px;
  --lb-sidebar-w: 232px;
  --lb-panel-w: 320px;
  --lb-composer-w: 720px;
  --lb-icon: 16px;
  --lb-icon-sm: 14px;
  --lb-icon-xs: 12px;
  --lb-icon-stroke: 1.75;

  --lb-motion-fast: 120ms ease;
  --lb-motion-base: 160ms ease;
}

html.theme-dark {
  --lb-bg-canvas: #111111;
  --lb-bg-chrome: #1b1b1b;
  --lb-bg-shell: #181818;
  --lb-bg-elevated: #262626;
  --lb-bg-input: #1e1e1e;
  --lb-bg-composer: #1a1a1a;
  --lb-bg-composer-top: rgba(255, 255, 255, 0.04);

  --lb-text: #dbdbdb;
  --lb-text-secondary: #b3b3b3;
  --lb-text-muted: #8f8f8f;
  --lb-text-disabled: #5c5c5c;

  --lb-border: #3a3a3a;
  --lb-border-strong: #484848;
  --lb-divider: #2a2a2a;

  --lb-hover: rgba(255, 255, 255, 0.07);
  --lb-pressed: rgba(255, 255, 255, 0.11);
  --lb-selected: rgba(10, 132, 255, 0.18);
  --lb-focus-ring: rgba(10, 132, 255, 0.42);
  --lb-danger: #ff6b6b;
  --lb-danger-subtle: rgba(255, 107, 107, 0.14);
  --lb-backdrop: rgba(0, 0, 0, 0.58);

  --lb-shadow-float: 0 2px 8px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.22);
  --lb-shadow-dialog: 0 4px 16px rgba(0, 0, 0, 0.32), 0 16px 48px rgba(0, 0, 0, 0.36);
}

/* —— 基础组件（样板专用） —— */

.lb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lb-space-2);
  height: var(--lb-control-md);
  padding: 0 var(--lb-space-4);
  border: 1px solid transparent;
  border-radius: var(--lb-radius-control);
  background: transparent;
  color: var(--lb-text);
  font-family: var(--lb-font);
  font-size: var(--lb-type-body);
  font-weight: var(--lb-weight-medium);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--lb-motion-fast), border-color var(--lb-motion-fast);
}
.lb-btn:hover { background: var(--lb-hover); }
.lb-btn:active { background: var(--lb-pressed); }
.lb-btn:focus-visible { outline: 2px solid var(--lb-focus-ring); outline-offset: 1px; }
.lb-btn:disabled { color: var(--lb-text-disabled); pointer-events: none; }
.lb-btn.is-primary { background: var(--lb-accent); color: var(--lb-text-on-accent); }
.lb-btn.is-primary:hover { background: var(--lb-accent-hover); }
.lb-btn.is-secondary { border-color: var(--lb-border-strong); background: var(--lb-bg-elevated); }
.lb-btn.is-tonal { background: var(--lb-accent-subtle); color: var(--lb-accent); }
.lb-btn.is-danger { color: var(--lb-danger); }
.lb-btn.is-danger:hover { background: var(--lb-danger-subtle); }
.lb-btn.is-sm { height: var(--lb-control-sm); padding: 0 var(--lb-space-3); font-size: var(--lb-type-compact); }
.lb-btn.is-icon { width: var(--lb-control-md); padding: 0; }
.lb-btn.is-icon.is-sm { width: var(--lb-control-sm); }

.lb-input {
  height: var(--lb-control-md);
  padding: 0 var(--lb-space-3);
  border: 1px solid var(--lb-border);
  border-radius: var(--lb-radius-control);
  background: var(--lb-bg-input);
  color: var(--lb-text);
  font-family: var(--lb-font);
  font-size: var(--lb-type-body);
  transition: border-color var(--lb-motion-fast), box-shadow var(--lb-motion-fast);
}
.lb-input::placeholder { color: var(--lb-text-muted); }
.lb-input:hover { border-color: var(--lb-border-strong); }
.lb-input:focus { outline: none; border-color: var(--lb-accent); box-shadow: 0 0 0 2px var(--lb-focus-ring); }

.lb-menu {
  min-width: 168px;
  padding: var(--lb-space-1);
  border: 1px solid var(--lb-border);
  border-radius: var(--lb-radius-float);
  background: var(--lb-bg-elevated);
  box-shadow: var(--lb-shadow-float);
}
.lb-menu-item {
  display: flex;
  align-items: center;
  gap: var(--lb-space-3);
  width: 100%;
  height: var(--lb-menu-item-h);
  padding: 0 var(--lb-space-3);
  border: none;
  border-radius: var(--lb-radius-chrome);
  background: transparent;
  color: var(--lb-text);
  font-family: var(--lb-font);
  font-size: var(--lb-type-body);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--lb-motion-fast);
}
.lb-menu-item:hover { background: var(--lb-hover); }
.lb-menu-item.is-active { background: var(--lb-selected); color: var(--lb-accent); }
.lb-menu-item.is-danger { color: var(--lb-danger); }
.lb-menu-divider { height: 1px; margin: var(--lb-space-1) var(--lb-space-2); background: var(--lb-divider); }

.lb-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-2);
  height: var(--lb-control-sm);
  padding: 0 var(--lb-space-3);
  border: 1px solid var(--lb-border);
  border-radius: var(--lb-radius-pill);
  background: var(--lb-bg-elevated);
  color: var(--lb-text-secondary);
  font-size: var(--lb-type-compact);
  cursor: pointer;
  transition: background-color var(--lb-motion-fast), border-color var(--lb-motion-fast);
}
.lb-chip:hover { background: var(--lb-hover); }
.lb-chip.is-selected { border-color: transparent; background: var(--lb-selected); color: var(--lb-accent); }

.lb-switch {
  position: relative;
  width: 34px;
  height: 20px;
  border-radius: var(--lb-radius-pill);
  background: var(--lb-border);
  cursor: pointer;
  transition: background-color var(--lb-motion-base);
}
.lb-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform var(--lb-motion-base);
}
.lb-switch.is-on { background: var(--lb-accent); }
.lb-switch.is-on::after { transform: translateX(14px); }

.ico { display:inline-flex; align-items:center; justify-content:center; width:14px; font-size:12px; line-height:1; opacity:.85; }
</style>
</head>
<body>
  <div class="proto-badge">视觉样板 A · 创作工作区壳层（Spectrum 2 桌面版）</div>

  <div class="workspace">
    <header class="titlebar">
      <div class="titlebar-drag"></div>
      <div class="titlebar-tools">
        <input class="titlebar-search" type="text" placeholder="搜索画布内节点与功能">
        <button class="lb-btn is-icon is-sm" type="button" title="用户"><span class="ico" aria-hidden="true">👤</span></button>
        <button class="lb-btn is-icon is-sm" type="button" title="历史"><span class="ico" aria-hidden="true">🕐</span></button>
