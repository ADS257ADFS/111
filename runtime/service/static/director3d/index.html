    <title>3D导演台</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') document.documentElement.classList.add('theme-dark');
            } catch(e) {}
        })();
    </script>

                <div id="director3dMannequinPanel" class="director3d-library-panel"></div>
            </aside>
            <section id="director3dViewport" class="director3d-viewport" data-director3d-viewport>

            </aside>
        </main>
        <section id="director3dTimeline" class="director3d-timeline" aria-label="时间轴"></section>
    </div>
