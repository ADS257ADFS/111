<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>Coding Agent</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                } else if(theme === 'aura') {
                    document.documentElement.classList.add('studio-theme-aura');
                    document.documentElement.classList.add('theme-aura');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/mutation-observer-guard.js?v=2026.06.08.85"></script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.06.08.85"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.06.08.85"></script>
    <script src="/static/js/theme.js?v=2026.06.08.85"></script>
    <script src="/static/js/i18n.js?v=2026.06.08.85"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.26.rollback1">
    <link rel="stylesheet" href="/static/apps/studio-coding/css/studio-chat.css?v=2026.07.26.rollback1">
    <link rel="stylesheet" href="/static/apps/studio-coding/css/agent-chat.css?v=2026.07.26.rollback1">
    <link rel="stylesheet" href="/static/css/visual-system-preview.css?v=2026.08.09.98">
    <link rel="stylesheet" href="/static/css/visual-typography-system.css?v=2026.08.24.87">
<link rel="stylesheet" href="/static/css/dark-desaturated/apps-studio-coding-agent-chat.css?v=2026.08.09.99">
<link rel="stylesheet" href="/static/css/design-tokens.css?v=2026.08.24.87">
<link rel="stylesheet" href="/static/css/ui-primitives.css?v=2026.08.23.2">
<link rel="stylesheet" href="/static/css/minimax-visual.css?v=2026.08.24.87">
</head>
<body>
    <div class="chat-shell agent-shell coding-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div class="title-block">
                    <h1 id="chatTitle">Coding 对话</h1>
                    <p id="modelLabel">Ready</p>
                </div>
                <div class="top-actions">
                    <button onclick="newConversation()" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="file-plus"></i><span>新建</span></button>
                    <button onclick="toggleHistory(undefined, event)" class="action-btn" title="历史对话" data-i18n-title="chat.history"><i data-lucide="history"></i><span>历史</span></button>
                    <div id="historyPopover" class="history-popover">
                        <div class="flex items-center justify-between px-2 pb-3">
                            <span class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400" data-i18n="chat.historyTitle">Conversations</span>
                            <button onclick="toggleHistory(false, event)" class="text-gray-400 hover:text-black"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div id="threadList" class="thread-list"></div>
                    </div>
                </div>
            </div>
        </header>

        <section id="messages" class="messages"></section>

        <div class="composer-wrap">
            <div class="agent-composer-dock">
            <div class="composer composer-v2" id="composerV2">
                <div class="composer-resize-handle" id="composerResizeHandle" role="separator" aria-orientation="vertical" aria-label="拖拽调整输入框高度" title="向上拖拽拉高"></div>
                <div id="composerBody" class="composer-body composer-body-v2">
                    <div id="composerStandardView">
                        <textarea id="messageInput" rows="2" class="composer-input" placeholder="写代码、生图、清理磁盘、运行命令… Enter 发送" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                        <div id="refStrip" class="ref-strip"></div>
                    </div>
                    <div class="composer-toolbar">
                        <div class="composer-toolbar-left">
                            <button class="composer-icon-btn" type="button" onclick="document.getElementById('chatFileInput').click()" title="上传文件" aria-label="上传文件">
                                <i data-lucide="plus"></i>
                            </button>
                            <div class="composer-pill-wrap">
                                <button id="composerPermissionBtn" class="composer-pill composer-pill-permission" type="button" onclick="toggleComposerPermissionMenu(event)" aria-haspopup="menu" aria-expanded="false">
                                    <i data-lucide="shield" class="composer-pill-icon composer-pill-icon-permission"></i>
                                    <span id="composerPermissionLabel">请求批准</span>
                                    <i data-lucide="chevron-up" class="composer-chevron"></i>
                                </button>
                                <div id="composerPermissionMenu" class="composer-popover composer-permission-popover" role="menu" aria-label="权限">
                                    <div class="composer-popover-head">执行权限</div>
                                    <div class="composer-mode-list" role="group">
                                        <button type="button" class="composer-mode-option active" data-permission="ask" onclick="setPermissionLevel('ask', event)" role="menuitemradio" aria-checked="true">
                                            <span class="composer-mode-option-inner">
                                                <span class="composer-mode-option-title">请求批准</span>
                                                <span class="composer-mode-option-hint">写入/命令/生图前需你确认</span>
                                            </span>
                                        </button>
                                        <button type="button" class="composer-mode-option" data-permission="auto" onclick="setPermissionLevel('auto', event)" role="menuitemradio" aria-checked="false">
                                            <span class="composer-mode-option-inner">
                                                <span class="composer-mode-option-title">替我审批</span>
                                                <span class="composer-mode-option-hint">自动执行安全范围内的操作</span>
                                            </span>
                                        </button>
                                        <button type="button" class="composer-mode-option" data-permission="full" onclick="setPermissionLevel('full', event)" role="menuitemradio" aria-checked="false">
                                            <span class="composer-mode-option-inner">
                                                <span class="composer-mode-option-title">完全访问权限</span>
                                                <span class="composer-mode-option-hint">可访问用户目录、磁盘清理等系统任务</span>
                                            </span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="composer-pill-wrap">
                                <button id="composerSkillBtn" class="composer-pill composer-pill-skill" type="button" onclick="toggleComposerSkillMenu(event)" aria-haspopup="menu" aria-expanded="false">
                                    <i data-lucide="sparkles" class="composer-pill-icon"></i>
                                    <span id="composerSkillLabel">Skill</span>
                                    <i data-lucide="chevron-up" class="composer-chevron"></i>
                                </button>
                                <div id="composerSkillMenu" class="composer-popover composer-skill-popover" role="menu" aria-label="Skill">
                                    <div class="composer-popover-head">Agent Skill</div>
                                    <div id="composerSkillList" class="composer-mode-list" role="group"></div>
                                </div>
                            </div>
                        </div>
                        <div class="composer-toolbar-right">
                            <div class="composer-pill-wrap">
                                <button id="composerModelBtn" class="composer-pill composer-pill-model" type="button" onclick="toggleComposerModelMenu(event)" aria-haspopup="menu" aria-expanded="false">
                                    <i data-lucide="zap" class="composer-pill-icon"></i>
                                    <span id="composerModelLabel">Ready</span>
                                    <i data-lucide="chevron-up" class="composer-chevron"></i>
                                </button>
                                <div id="apiSettingsPanel" class="composer-popover composer-model-popover">
                                    <div class="composer-popover-head">
                                        <span>模型设置</span>
                                        <button type="button" onclick="toggleComposerModelMenu(false, event)" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                                    </div>
                                    <div class="api-settings-section">
                                        <label>语言模型</label>
                                        <div class="api-settings-row">
                                            <select id="agentChatProviderSelect" class="api-settings-select" onchange="setAgentChatProvider(this.value)"></select>
                                            <select id="agentChatModelSelect" class="api-settings-select" onchange="setActiveModel(this.value)"></select>
                                        </div>
                                    </div>
                                    <div class="api-settings-section">
                                        <label>生图模型</label>
                                        <div class="api-settings-row">
                                            <select id="agentImageProviderSelect" class="api-settings-select" onchange="setAgentImageProvider(this.value)"></select>
                                            <select id="agentImageModelSelect" class="api-settings-select" onchange="setAgentImageModel(this.value)"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn-v2" title="发送" data-i18n-title="chat.send" aria-label="发送">
                                <i data-lucide="arrow-up"></i>
                            </button>
                        </div>
                    </div>
                    <input id="chatFileInput" type="file" multiple hidden accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.txt,.md,.csv,.json,.xml,.html,.htm,.xls,.xlsx,.py,.js,.ts,.tsx,.jsx,.css,.vue,.go,.rs,.java,.c,.cpp,.h,.cs,.sql,.yaml,.yml,.toml,.ini,.bat,.sh" onchange="uploadFiles(this.files);this.value=''">
                </div>
            </div>
            </div>
        </div>
    </div>

    <script src="/static/apps/studio-coding/js/studio-chat-core.js?v=2026.06.08.85"></script>
    <script src="/static/apps/studio-coding/js/studio-chat-coding-agent.js?v=2026.06.08.85"></script>
    <script src="/static/apps/studio-coding/js/studio-chat-coding-app.js?v=2026.07.15.210"></script>
</body>
</html>
